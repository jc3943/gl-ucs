#version=DEVEL
# System authorization information
auth --enableshadow --passalgo=sha512
# Use CDROM installation media
cdrom
# Use graphical install
graphical
# Run the Setup Agent on first boot
firstboot --enable

# Keyboard layouts
keyboard --vckeymap=us --xlayouts='us'
# System language
lang en_US.UTF-8

DISKIDPLACEHOLDER

#Changes are required in the partition (part) directives that follow.
autopart --type=lvm

#Clear the Master Boot Record
zerombr

# Network information (static IPv4).
# RHEL9 FIX: --onboot=yes makes NetworkManager auto-activate the interface after
# the post-install reboot. Cisco's stock template used only --activate (install-
# time only), leaving the NIC down/unconfigured on RHEL 9.
# NOTE: template control-flow (if/else/end) was removed - the Intersight
# custom-file validator rejects it. Values still come from the answers block via
# flat field placeholders, so per-server bulk installs still work.
network --bootproto=static --device={{ .answers.NetworkDevice }} --onboot=yes --activate --gateway={{ .answers.IpV4Config.Gateway }} --ip={{ .answers.IpV4Config.IpAddress }} --nameserver={{ .answers.NameServer }} --netmask={{ .answers.IpV4Config.Netmask }}
network --hostname={{ .answers.Hostname }}

# Root password
rootpw --iscrypted {{ .answers.RootPassword }}
# System services
# RHEL9 FIX: explicitly enable NetworkManager (RHEL 9 removed legacy network-scripts).
services --enabled="chronyd,NetworkManager"
# System timezone
timezone America/New_York

%packages
@^minimal-environment
@development
@rpm-development-tools
@system-tools

%end

%addon com_redhat_kdump --disable --reserve-mb='auto'

%end

%anaconda
pwpolicy root --minlen=6 --minquality=1 --notstrict --nochanges --notempty
pwpolicy user --minlen=6 --minquality=1 --notstrict --nochanges --emptyok
pwpolicy luks --minlen=6 --minquality=1 --notstrict --nochanges --notempty
%end

# RHEL9 safety net: force autoconnect=true on every NetworkManager keyfile the
# installer writes (file-based edit; works without a running NM in the chroot).
%post --log=/root/ks-post-network.log
systemctl enable NetworkManager
for f in /etc/NetworkManager/system-connections/*.nmconnection; do
  [ -e "$f" ] || continue
  if grep -q '^autoconnect=' "$f"; then
    sed -i 's/^autoconnect=.*/autoconnect=true/' "$f"
  else
    sed -i '/^\[connection\]/a autoconnect=true' "$f"
  fi
  chmod 600 "$f"
done
%end

%post --nochroot --log=/root/ks-post.log
OS_INSTALL_COMPLETED_STATUS_PLACEHOLDER
%end

reboot
