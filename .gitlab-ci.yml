stages:
  - claimDevices
  - getInv
  - getSvrMoids
#  - updateSrc
#  - createRepos
  - installOs
  - installRke


variables:
  varPath: vars/$CI_COMMIT_REF_NAME
  dataPath: data/ucs
  TF_VAR_varPath: vars/$CI_COMMIT_REF_NAME
  TF_VAR_imcSeedFile: ../../vars/$CI_COMMIT_REF_NAME/imc/hostIpAddrs.csv

claimDevices:
  stage: claimDevices
  image: jc3943/ubuntu-tfe:20220911
  script:
    - python3 imc/imcNetSet.py -u admin -p DEVP@ssw0rd -i $varPath/imc/hostIpAddrs.csv
    - cd intersight/devClaims
    - terraform init
    - terraform apply -var-file=master.tfvars -auto-approve
    - cd ../../
    - python3 intersight/intersightDevClaimStatus.py -u https://dev-intersight.thor.iws.navy.mil -i $varPath/imc/hostIpAddrs.csv
    - sleep 600
  tags:
    - ocp
  only:
    - imcPwrOpt

getPhyInv:
  stage: getInv
  artifacts:
    paths:
      - data/ucs
    expire_in: 2 hour
  image: jcomer3943/ubuntu:2025-10-02
  script:
    - python3 intersight/ucsInventory-v2.py --type svrSummary
  tags:
    - ocp
  only:
    - imcPwrOpt

getDiskInv:
  stage: getInv
  artifacts:
    paths:
      - data/ucs
    expire_in: 2 hour
  image: jcomer3943/ubuntu:2025-10-02
  script:
    - python3 intersight/ucsInventory-v2.py --type diskInventory
  tags:
    - ocp
  only:
    - imcPwrOpt

getVmHostInv:
  stage: getInv
  artifacts:
    paths:
      - data/ucs
    expire_in: 2 hour
  image: jcomer3943/ubuntu:2025-10-02
  script:
    - python3 intersight/ucsInventory-v2.py --type vmmHost
  tags:
    - ocp
  only:
    - imcPwrOpt

getVmInv:
  stage: getInv
  artifacts:
    paths:
      - data/ucs
    expire_in: 2 hour
  image: jcomer3943/ubuntu:2025-10-02
  script:
    - python3 intersight/ucsInventory-v2.py --type vmmInventory
  tags:
    - ocp
  only:
    - imcPwrOpt

getSvrMoids:
  stage: getSvrMoids
  artifacts:
    paths:
      - data/ucs
    expire_in: 2 hour
  image: jcomer3943/ubuntu:2025-10-02
  script:
    - python3 intersight/intersightBuildBmYaml.py --infile $varPath/imc/bmHostAddrs.csv --pw DEVP@ssw0rd
  tags:
    - ocp
  only:
    - imcPwrOpt

