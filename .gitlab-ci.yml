installOs:
  stage: installOs
  image: jc3943/ubuntu-tfe:20220911
  script:
    - cd bm-install/os_install_bulk
    - terraform init
    - terraform apply --var-file=../../vars/imcPwrOpt/terraform/rhel_install.tfvars -auto-approve
    - cd ../../
    - sleep 120
    - python3 intersight/osInstallStatus.py -u https://dev-intersight.thor.iws.navy.mil
  tags:
    - ocp
  only:
    - imcPwrOpt

installRke:
  stage: installRke
  image: jc3943/ubuntu-tfe:20220911
  script:
    - cd rke
    - terraform init
    - terraform apply -auto-approve
    - cd ../../
  tags:
    - ocp
  only:
    - imcPwrOpt